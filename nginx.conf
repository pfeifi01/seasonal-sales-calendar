server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite writes content-hashed filenames into /assets, so they can be
    # cached forever — a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # pointing at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so no CORS and no cookie trouble. The backend
    # container is not published to the host at all — this is the only way
    # in. Confirmation and unsubscribe links in emails land here too.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
