services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sale-season-ui
    depends_on:
      - backend
    ports:
      # host:container — 8086 is this project's slot on the NAS.
      # 8080-8085 and 8090 are already taken by the other sites.
      - "8086:8000"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sale-season-api
    environment:
      # Read from a .env file next to this docker-compose.yml, which Compose
      # loads automatically. See .env.example. There is deliberately no
      # default for SMTP_PASSWORD — the backend refuses to start without it
      # rather than coming up unable to send anything.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Sale Season}
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-}
      SITE_URL: ${SITE_URL:-https://sales.pfeifhofer.dev}
      REMINDER_CRON: ${REMINDER_CRON:-0 8 * * *}
      REMINDER_TZ: ${REMINDER_TZ:-Europe/Vienna}
    volumes:
      # Subscriber list and delivery history, which must survive rebuilds.
      # The generated dataset deliberately lives in /app/catalog instead, so
      # this mount cannot hide it — and mounting individual files that do not
      # exist yet would make Docker create them as directories.
      - ./backend/data:/app/data
    restart: unless-stopped
    # Not published to the host — only the frontend container reaches it,
    # proxying /api/* over the internal docker network.
    expose:
      - "4000"
